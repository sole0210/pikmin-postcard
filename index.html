async function refreshCardsNow(){if(!signedIn)return;const serial=++refreshSerial;try{const rows=[];for(let from=0;;from+=500){const {data,error}=await client.from('postcard_cards').select('*').eq('owner_id',OWNER).order('id').range(from,from+499);if(error)throw error;rows.push(...data);if(data.length<500)break}if(serial!==refreshSerial||!signedIn)return;startupTimes.serverListReady=performance.now();finishStartup();storeRecentRows(rows);knownIds=new Set(rows.map(r=>r.id));const signature=JSON.stringify(rows);if(signature!==lastRowsSignature){lastRowsSignature=signature;items=rows.filter(r=>!r.deleted_at).map(r=>({id:r.id,name:'엽서',title:r.title||'',category:r.category,coords:r.coords,image:imageCache.get(r.image_path)?.url||'',image_path:r.image_path,favorite:r.favorite,created:r.created}));render()}migrationState();status(channel?.state==='joined'?'실시간 연결됨':'동기화됨')}catch(e){if(serial===refreshSerial){status('연결 확인 필요');toast('동기화 실패: '+e.message)}}}
function scheduleRefresh(){clearTimeout(refreshTimer);refreshTimer=setTimeout(refreshCards,200)}
async function openDB(){traceStartup('auth-initialize');const initialized=await client.auth.initialize();if(initialized?.error)throw initialized.error;traceStartup('auth-initialized');const {data,error}=await client.auth.getSession();if(error)throw error;traceStartup('session-loaded');if(!data.session){startupTimes.noSavedSession=true;$('slowConnection').hidden=true}client.auth.onAuthStateChange((event,session)=>{setTimeout(()=>applySession(session),0)});await applySession(data.session);setTimeout(()=>readLocalCards().then(migrationState),1200)}
async function applySession(session){const uid=session?.user?.id||null;if(!localPreview&&uid===authUid&&((uid&&signedIn)||!uid)){if(uid)scheduleRefresh();return}authUid=uid;startupTimes.sessionResolved=performance.now();clearPreviewState();if(channel){await client.removeChannel(channel);channel=null}signedIn=uid===OWNER;document.body.classList.toggle('signed-out',!signedIn);$('logout').hidden=!signedIn;if(!signedIn){refreshSerial++;try{localStorage.removeItem(LIST_CACHE_KEY)}catch{}clearSavedThumbs();lastRowsSignature='';items=[];knownIds.clear();for(const v of imageCache.values())URL.revokeObjectURL(v.url);imageCache.clear();postcardThumbCache.clear();$('preview').removeAttribute('src');$('full').removeAttribute('src');$('editor').close();$('viewer').close();pendingImage=null;render();migrationState();status(uid?'등록된 본인 계정으로 로그인해주세요.':'로그인 필요');if(uid){$('authError').textContent='이 계정에는 접근 권한이 없습니다.';await client.auth.signOut({scope:'local'})}return}showRecentRows();status('연결 중…');$('loginForm').reset();$('authError').textContent='';channel=client.channel('postcard-owner').on('postgres_changes',{event:'*',schema:'public',table:'postcard_cards',filter:'owner_id=eq.'+OWNER},scheduleRefresh).subscribe(state=>{if(state==='SUBSCRIBED'){status('실시간 연결됨');scheduleRefresh()}else if(state==='CHANNEL_ERROR'||state==='TIMED_OUT')status('재연결 중…')});await refreshCards()}
async function write(records,remove){requireOwner();if(remove){const {data,error}=await client.from('postcard_cards').update({deleted_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',remove).eq('owner_id',OWNER).select('id');if(error)throw error;if(!data.length)throw Error('엽서가 이미 삭제되었거나 접근할 수 없습니다.');scheduleRefresh();return}
for(const c of records){let imagePath=c.image_path;const old=items.find(x=>x.id===c.id);let uploaded=false;if(!imagePath||c.image!==old?.image){if(!c.image?.startsWith('data:image/')){if(!imagePath)throw Error('이미지를 다시 선택해주세요.')}else{const blob=await(await fetch(c.image)).blob();imagePath=OWNER+'/'+newId()+'.png';const {error}=await client.storage.from('postcard-images').upload(imagePath,blob,{contentType:'image/png',upsert:false});if(error)throw error;uploaded=true}}
const row={id:c.id,owner_id:OWNER,title:c.title||'',category:c.category||'mushroom',coords:coords(c.coords),image_path:imagePath,favorite:!!c.favorite,created:c.created,updated_at:new Date().toISOString()};const {error}=await client.from('postcard_cards').upsert(row,{onConflict:'id'});if(error){if(uploaded)await client.storage.from('postcard-images').remove([imagePath]);throw error}c.image_path=imagePath;knownIds.add(c.id)}
scheduleRefresh()}
function newId(){return globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
async function toggleFavorite(c){requireOwner();const {error}=await client.from('postcard_cards').update({favorite:!c.favorite,updated_at:new Date().toISOString()}).eq('id',c.id).eq('owner_id',OWNER).is('deleted_at',null);if(error)throw error;items=items.map(x=>x.id===c.id?{...x,favorite:!c.favorite}:x);render();scheduleRefresh()}
function blobData(blob){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(blob)})}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginSubmit').disabled=true;$('authError').textContent='';try{const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;if(data.user.id!==OWNER)throw Error('등록된 본인 계정으로 로그인해주세요.');await applySession(data.session)}catch(e){$('authError').textContent=e.message==='Invalid login credentials'?'이메일 또는 비밀번호를 확인해주세요.':e.message}finally{$('password').value='';$('loginSubmit').disabled=false}};
$('logout').onclick=async()=>{const {error}=await client.auth.signOut({scope:'local'});if(error)toast(error.message);else await applySession(null)};
$('migrate').onclick=async()=>{if(!confirm('이 브라우저의 기존 엽서를 본인 온라인 저장소에 올릴까요?'))return;$('migrate').disabled=true;let count=0;try{requireOwner();for(const c of localCards){if(knownIds.has(c.id))continue;await write([{...c,category:c.category||'mushroom'}]);count++}await refreshCards();toast(count+'장의 엽서를 옮겼어요.')}catch(e){toast(count+'장 완료. 나머지는 다시 시도해주세요: '+e.message)}finally{$('migrate').disabled=false;migrationState()}};
window.addEventListener('online',scheduleRefresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)scheduleRefresh()});setInterval(()=>{if(signedIn&&!document.hidden)refreshCards()},60000);

const locationCache=new Map();
const countryNames=new Intl.DisplayNames(['ko'],{type:'region'});
function inRing(lon,lat,ring){let inside=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const a=ring[i],b=ring[j];if((a[1]>lat)!==(b[1]>lat)&&lon<(b[0]-a[0])*(lat-a[1])/(b[1]-a[1])+a[0])inside=!inside}return inside}
function inPolygon(lon,lat,polygon){return inRing(lon,lat,polygon[0])&&!polygon.slice(1).some(r=>inRing(lon,lat,r))}
function getLocation(value){if(locationCache.has(value))return locationCache.get(value);try{const [lat,lon]=value.split(',').map(Number);const zone=tzlookup(lat,lon);const country=countryShapes.find(c=>c.polygons.some(p=>inPolygon(lon,lat,p)));const separateRegions={'Asia/Hong_Kong':'HK','Asia/Macau':'MO','Asia/Macao':'MO','Asia/Taipei':'TW'};const code=separateRegions[zone]||country?.code||zoneCountries[zone];const info={zone,country:({'HK':'홍콩','MO':'마카오','TW':'대만','CN':'중국'})[code]||(code?countryNames.of(code):'현지'),formatter:new Intl.DateTimeFormat('ko-KR',{timeZone:zone,hour:'numeric',minute:'2-digit',hour12:true})};locationCache.set(value,info);return info}catch{return null}}
function localTimeElement(value){const e=node('p','localTime');e.dataset.coords=value;return e}

const dayFormatters=new Map();
function dayNumberAt(now,zone){let f=dayFormatters.get(zone);if(!f){f=new Intl.DateTimeFormat('en-US',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',calendar:'gregory',numberingSystem:'latn'});dayFormatters.set(zone,f)}const parts=f.formatToParts(now);const part=type=>Number(parts.find(p=>p.type===type).value);return Date.UTC(part('year'),part('month')-1,part('day'))/86400000}
function koreanRelativeDay(now,zone){const delta=dayNumberAt(now,zone)-dayNumberAt(now,'Asia/Seoul');if(delta===0)return '';if(delta===-1)return '어제 ';if(delta===1)return '내일 ';return delta<0?Math.abs(delta)+'일 전 ':delta+'일 후 '}
function updateLocalTimes(now=new Date()){document.querySelectorAll('.localTime').forEach(e=>{const info=getLocation(e.dataset.coords);e.textContent=info?info.country+' · '+koreanRelativeDay(now,info.zone)+info.formatter.format(now):'현지 시간 확인 불가';e.title=info?'한국 날짜 기준 · 좌표의 현지 시간 · '+info.zone+' (국경·시간대 경계에서는 차이가 있을 수 있어요)':''})}

setInterval(updateLocalTimes,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateLocalTimes()});
